<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的歌单</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='playlists.css') }}">
</head>
<body><main class="library">
  <header><h1>我的歌单</h1><p>添加你喜欢的歌曲，用它们生成一份新的推荐歌单。</p></header>
  <nav><a href="{{ url_for('index') }}">按风格和歌手推荐</a></nav>
  {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  <section class="panel">
    <h2>创建歌单</h2>
    <form method="post" class="controls">
      <input type="hidden" name="csrf" value="{{ session.playlist_csrf }}">
      <label>歌单名称 <input name="name" maxlength="80" required></label>
      <button>创建歌单</button>
    </form>
  </section>
  <section class="panel">
    <h2>已保存的歌单</h2>
    {% for playlist in playlists %}
      <article><a href="{{ url_for('playlists.detail', playlist_id=playlist.id) }}">{{ playlist.name }}</a><span>{{ playlist.song_count }} 首</span></article>
    {% else %}<p class="muted">还没有歌单。</p>{% endfor %}
  </section>
</main>
<script>
(function () {
  function norm(s) { return (s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
  function collectNames(root) {
    var out = [];
    Array.prototype.forEach.call(root.querySelectorAll('a[href^="/playlists/"]'), function (a) {
      var href = a.getAttribute('href') || '';
      if (!/^\/playlists\/\d+/.test(href)) return;
      var name = norm(a.textContent);
      if (name) out.push(name);
    });
    return out;
  }
  var known = collectNames(document);
  function showError(form, msg) {
    var box = form.querySelector('.dup-error');
    if (!box) {
      box = document.createElement('p');
      box.className = 'dup-error';
      box.style.color = '#b00020';
      box.style.margin = '6px 0';
      box.style.fontSize = '13px';
      form.appendChild(box);
    }
    box.textContent = msg;
  }
  function clearError(form) {
    var box = form.querySelector('.dup-error');
    if (box) box.remove();
  }
  function bind(form) {
    var input = form.querySelector('input[name="name"]');
    if (!input) return;
    input.addEventListener('input', function () { clearError(form); });
    form.addEventListener('submit', function (ev) {
      var value = norm(input.value);
      if (!value) return;
      function reject() {
        ev.preventDefault();
        showError(form, '歌单名称「' + input.value.trim() + '」已存在，请换一个名字。');
        input.focus();
      }
      if (known.length) {
        if (known.indexOf(value) >= 0) reject();
        return;
      }
      ev.preventDefault();
      fetch('/playlists/', { credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          known = collectNames(new DOMParser().parseFromString(text, 'text/html'));
          if (known.indexOf(value) >= 0) reject();
          else form.submit();
        })
        .catch(function () { form.submit(); });
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('form'), bind);
})();
</script>
</body>
</html>
